name: test

# THE KERNEL HALF OF THIS PACKAGE CANNOT BE UNIT-TESTED. `IFF_NO_PI`, the ioctl, the policy rule, the
# default route and the SO_MARK rules are all things the kernel does to a real namespace, and a test
# that mocked them would prove nothing about the ioctl that actually matters.
#
# SO THERE ARE TWO JOBS, AND THE DIFFERENCE IS WHAT THEY MAY TOUCH:
#
#	unit      no privileges, no device. The packet layer, the SOCKS5 framing, the relay's session table
#	          and the whole forwarding path, driven through a pipe against real in-process servers.
#	          This is the `go test ./...` anyone runs.
#
#	kernel    INSIDE A PRIVILEGED CONTAINER with `--device /dev/net/tun --cap-add NET_ADMIN`.
#
# WHY THE KERNEL JOB IS A CONTAINER AND NOT `sudo` ON THE RUNNER, WHICH IT USED TO BE
#
# THE TESTS CHANGE THE NETWORK NAMESPACE THEY RUN IN: `StartContainer` moves the default route into a
# tun, installs SO_MARK rules, and puts it back on Close. On the runner that namespace is the RUNNER'S,
# so a bug in the restore takes the runner's own network with it - and one did: `ip route flush table 0`
# flushed main, and the symptom was every later step timing out for no stated reason.
#
# IN A CONTAINER THE NAMESPACE IS THE CONTAINER'S. A test that breaks the routing breaks one container
# that is thrown away, and the runner is untouched. It is also what a caller actually does: the README
# asks for `--device /dev/net/tun --cap-add NET_ADMIN`, so this job runs the documented invocation
# rather than a root shortcut that no caller has.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (no privileges)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # NO CACHE: this module has no dependencies, so there is no `go.sum` for the cache key and
          # every run would warn that it could not restore one. Measured on the first green run.
          cache: false
      - name: gofmt
        run: |
          set -eu
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1 -race -cover

  kernel:
    name: e2e (a real tun device, in a container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # THE DEVICE NODE ON THE HOST. The `tun` module is built into (or loaded by) every kernel
      # GitHub's runners use, so this is the character device that talks to it - major 10, minor 200,
      # which is what /proc/misc reports as `tun`. `mknod` tolerates EEXIST because the runner usually
      # already has one (MEASURED: the first version failed with `mknod: File exists`).
      - name: ensure the host has /dev/net/tun
        run: |
          set -eux
          if [ ! -e /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
            sudo chmod 666 /dev/net/tun
          fi
          ls -l /dev/net/tun
          grep tun /proc/misc

      # THE TESTS RUN IN A CONTAINER THAT HAS EXACTLY WHAT THE README ASKS A CALLER FOR.
      #
      # THE SOURCE IS A BIND MOUNT and GOCACHE is a writable path inside it, so the Go toolchain
      # compiles on every run and nothing is cached in a place the next job cannot see. `-v` of the
      # module cache would be faster, but this module has no dependencies, so there is nothing to cache.
      #
      # `--device` RATHER THAN `-v /dev/net` : a bind mount of a character device works, but `--device`
      # is what the README documents and what makes the container's permission bits right. If the
      # device is missing, StartContainer refuses with a sentence naming it - which the assertions
      # below would report as a failure, not a silent skip.
      # THE CONTAINER MUST HAVE A DEFAULT ROUTE WITH A GATEWAY, because
      # `TestE2EContainerTakesOverTheDefaultRoute` takes it over and puts it back - and it SKIPS where
      # there is none, which the assertion below would report as "a kernel test skipped" without
      # naming the real cause. Docker's default bridge gives that route; this checks it rather than
      # inheriting an assumption.
      - name: the container has a default route to take over
        run: |
          set -eux
          # THE SCRIPT IS A FILE, not an awk one-liner escaped through YAML and `sh -c`: three layers
          # of quoting is how a check becomes a syntax error nobody can read. See the file's own header.
          docker run --rm -v "$PWD/.github/assert-default-route.sh:/check.sh:ro" \
            golang:1.26 sh /check.sh

      # THE IMAGE NEEDS `ip`, AND THIS IS THE FIRST THING THE CONTAINER APPROACH FOUND.
      #
      # `golang:1.26` HAS NO iproute2, so every kernel test failed with
      #
      #	`ip [addr add 10.99.60.1/24 dev e2etun0]`: exec: "ip": executable file not found in $PATH
      #
      # That is not a bug in the library - it shells out to `ip` on purpose, so the caller's container
      # must have it, and the README says so. Installing it here is what makes this job run the
      # documented invocation rather than a privileged one that has everything by accident.
      - name: the kernel half, in a container with the device
        run: |
          set -eux
          # ONE CONTAINER RUN, AND ITS EXIT STATUS IS THE ASSERTION. Inside it:
          #   - the selected tests run with -v so the log names each one
          #   - a SKIP fails the job, because a green run that skipped every kernel test proves nothing
          docker run --rm \
            --device /dev/net/tun:/dev/net/tun \
            --cap-add NET_ADMIN \
            -v "$PWD:/src" \
            -w /src \
            -e GOCACHE=/tmp/go-cache \
            -e GOFLAGS=-buildvcs=false \
            golang:1.26 \
            sh -c '
              set -eu
              apt-get update -qq && apt-get install -y -qq iproute2 >/dev/null
              go test ./... -count=1 -v -run "E2E|TestOpenTun|TestIfreq" > /tmp/kernel.log 2>&1 || {
                cat /tmp/kernel.log; exit 1;
              }
              cat /tmp/kernel.log
              if grep -q "^--- SKIP" /tmp/kernel.log; then
                echo "::error::a kernel test skipped, so the device was not usable in this container"
                grep -A3 "^--- SKIP" /tmp/kernel.log
                exit 1
              fi
              echo "passed: $(grep -c "^--- PASS" /tmp/kernel.log) kernel tests"
            '

      # AND THE WHOLE SUITE, in the same container, because the unit tests also have to pass where the
      # loopback needed raising and where a device exists. Running it twice (once selected, once whole)
      # is deliberate: the selected run proves the kernel tests RAN rather than skipped, and the whole
      # run proves the rest still passes in this environment.
      - name: the whole suite, in the same container
        run: |
          set -eux
          docker run --rm \
            --device /dev/net/tun:/dev/net/tun \
            --cap-add NET_ADMIN \
            -v "$PWD:/src" \
            -w /src \
            -e GOCACHE=/tmp/go-cache \
            -e GOFLAGS=-buildvcs=false \
            golang:1.26 \
            sh -c '
              set -eu
              apt-get update -qq && apt-get install -y -qq iproute2 >/dev/null
              go test ./... -count=1 -race
            '
